name: release-reproduction-checks

on:
  push:
  pull_request:

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python -m unittest discover -s tests -p "test_core.py" -v
      - run: python -m unittest discover -s tests -p "test_public_v2.py" -v
      - run: python reproduction/v2/reproduce.py demo --out reproduced
      - run: python scripts/check_paper_consistency.py
      - run: python scripts/verify_fixture.py fixtures/m4sar/COUNTERFACTUAL_CONFIRMATORY_FIXTURE.jsonl --expected-sha256 94b71c918476a266a901ee7d3430f16d3c104369c6ce29c1cce1a4e50555baef
      - run: python scripts/verify_fixture.py fixtures/bigearthnet/BIGEARTHNET_EXTERNAL_FULL_FIXTURE.jsonl --expected-sha256 262ebdcc3b09da82ed4508cae7edce9235857b864acd81b2130078be51fda6cb
